<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio FP Cocina — APPCC, EDO, Alérgenos, Alteraciones</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <!-- PANTALLA DE INICIO -->
        <div id="homeScreen" class="screen active">
            <h1>📚 Estudio FP Cocina</h1>
            <p class="subtitle">Elige un tema para empezar</p>
            <div class="temas-grid">
                <div class="tema-card appcc"        onclick="selectTema('appcc')">🔍 APPCC</div>
                <div class="tema-card edo"          onclick="selectTema('edo')">⚠️ EDO</div>
                <div class="tema-card alergenos"    onclick="selectTema('alergenos')">🚫 Alérgenos</div>
                <div class="tema-card alteraciones" onclick="selectTema('alteraciones')">🔬 Alteraciones</div>
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="selectTema('examen')">
                🎓 Examen Final (20 preguntas)
            </button>
        </div>

        <!-- PANTALLA DE SELECCIÓN DE MODO -->
        <div id="modoScreen" class="screen">
            <div class="header">
                <button class="back-btn" onclick="goHome()">← Atrás</button>
                <h2 id="temaTitle"></h2>
            </div>
            <p class="subtitle">Elige cómo quieres estudiar</p>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <button class="btn btn-primary" style="padding: 25px; font-size: 18px;" onclick="startFlashcards()">
                    🎴 Flashcards
                </button>
                <button class="btn btn-success" style="padding: 25px; font-size: 18px;" onclick="startTest()">
                    ✏️ Test
                </button>
            </div>
        </div>

        <!-- PANTALLA DE FLASHCARDS -->
        <div id="flashcardsScreen" class="screen">
            <div class="header">
                <button class="back-btn" onclick="goHome()">← Atrás</button>
                <h2 id="flashcardTemaTitle"></h2>
            </div>
            <div class="progress-text" id="flashcardProgress"></div>
            <div class="progress-bar">
                <div class="progress-fill" id="flashcardProgressBar"></div>
            </div>
            <div class="flashcard-container">
                <div class="flashcard" id="flashcard" onclick="flipCard()">
                    <div class="flashcard-face flashcard-front">
                        <div>
                            <div id="flashcardQuestion"></div>
                            <div class="flashcard-hint">Toca para ver la respuesta</div>
                        </div>
                    </div>
                    <div class="flashcard-face flashcard-back">
                        <div id="flashcardAnswer"></div>
                    </div>
                </div>
            </div>
            <div class="buttons">
                <button class="btn btn-danger"  onclick="markWrong()">🔄 Repasar</button>
                <button class="btn btn-success" onclick="markCorrect()">✓ ¡Lo sé!</button>
            </div>
        </div>

        <!-- PANTALLA DE TEST -->
        <div id="testScreen" class="screen">
            <div class="header">
                <button class="back-btn" onclick="goHome()">← Atrás</button>
                <h2 id="testTemaTitle"></h2>
            </div>
            <div class="progress-text" id="testProgress"></div>
            <div class="progress-bar">
                <div class="progress-fill" id="testProgressBar"></div>
            </div>
            <div class="question-container">
                <div class="question-text" id="questionText"></div>
                <div class="options" id="optionsContainer"></div>
                <div class="feedback" id="feedback"></div>
            </div>
            <div class="buttons">
                <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                    Siguiente →
                </button>
            </div>
        </div>

        <!-- PANTALLA DE RESULTADOS -->
        <div id="resultsScreen" class="screen">
            <button class="back-btn" onclick="goHome()">← Atrás</button>
            <div class="results-screen">
                <div class="score-circle" id="scoreCircle">0/0</div>
                <div class="message"    id="resultMessage"></div>
                <div class="submessage" id="resultSubmessage"></div>
                <div class="results-detail" id="resultsDetail" style="display: none;"></div>
                <div class="buttons">
                    <button class="btn btn-primary"   onclick="repeatMode()">🔄 Repetir</button>
                    <button class="btn btn-secondary" onclick="goHome()">🏠 Inicio</button>
                </div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
